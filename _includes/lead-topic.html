<label class="lead-topic__label">
  <span>{{ site.data.site.forms.topic_label | escape }}</span>
  <select class="lead-topic__select" name="topic" required>
    <option value="" selected disabled>{{ site.data.site.forms.topic_placeholder | escape }}</option>
    {% for topic in site.data.site.forms.topic_options %}<option>{{ topic | escape }}</option>{% endfor %}
  </select>
</label>
